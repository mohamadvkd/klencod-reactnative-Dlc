# ============================================================
# React Native Gradle Properties
# ============================================================

# JVM args
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true

# Hermes (JS Engine)
hermesEnabled=true

# New Architecture (Fabric + TurboModules)
# معطّلة لتجنب الحاجة إلى NDK
newArchEnabled=false

# React Native Architectures
# لا نحتاجها إذا كانت newArchEnabled=false
# reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64

# NDK Version — معطّل لتفادي فشل التنزيل
# android.ndkVersion=

# Kotlin
kotlin.code.style=official